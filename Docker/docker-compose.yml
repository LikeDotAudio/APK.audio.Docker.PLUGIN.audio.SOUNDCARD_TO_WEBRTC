# PLUGIN:SOUNDCARD_IN — Capture a sound card and offer it over WebRTC, one container.
#     COMPOSE_PROFILES=sound docker compose -f 'PODS/POD:THICK/plugin/PLUGIN:SOUNDCARD_IN/Docker/docker-compose.yml' up -d --build
# Normally started with the other plugins, by node role (see discovery):
#     COMPOSE_PROFILES=discovery,l2 docker compose -f 'PODS/POD:THICK/discovery/Docker/docker-compose.yml' up -d
# The image, the capability floor, the broker variables and the healthcheck are
# the base service in discovery/Docker/plugin-base.yml; this file says
# only what is THIS plugin's. No bind mounts, so no `bind:` sub-key to carry.

# ONE PROJECT WITH THE REST (`apk-audio`), so the plugins clump with the node.
name: apk-audio

services:
  soundcard-in:
    extends:
      file: "../../../discovery/Docker/plugin-base.yml"
      service: plugin-host
    container_name: Plugin-SOUNDCARD_IN
    command: ["soundcard-to-webrtc", "--broker", "${APK_BAREMETAL_MQTT_HOST:-127.0.0.1}", "--broker-port", "${APK_BAREMETAL_MQTT_PORT:-1883}", "--room", "${APK_SOUNDCARD_ROOM:-default}"]
    profiles: [sound]
    # A sound card, and only this container's. The binary takes the broker on
    # argv rather than the environment, so compose interpolates it here.
    devices:
      - /dev/snd:/dev/snd
    group_add: [audio]
    # Not built on apk-plugin-runner, so there is no health file to read; the
    # base check would report it unhealthy for ever.
    healthcheck:
      disable: true

volumes:
  # LOGGER STORAGE — owned by DATABSE:volume:Log STORAGE, which is up first.
  apk-audio-logs:
    name: apk-audio-logs
    external: true
  mac-lookup-cache:
    name: apk-audio-mac-lookup-cache

# PLUGIN.SOUNDCARD_IN — Capture a sound card and offer it over WebRTC, one container.
#     COMPOSE_PROFILES=sound docker compose -f 'PODS/POD.THICK/PLUGINS/PLUGIN.SOUNDCARD_IN/Docker/docker-compose.yml' up -d --build
# Normally started with the other plugins, by node role (see discovery):
#     COMPOSE_PROFILES=discovery,l2 docker compose -f 'PODS/POD.THICK/DISCOVERY.Engine/Docker/docker-compose.yml' up -d
# The image, the capability floor, the broker variables and the healthcheck are
# the base service in DISCOVERY.Engine/Docker/plugin-base.yml; this file says
# only what is THIS plugin's. No bind mounts, so no `bind:` sub-key to carry.

# ONE PROJECT WITH THE REST (`apk-audio`), so the plugins clump with the node.
name: apk-audio

# IN THE POD: the discovery engine's compose file must `include:` this one, and
# DockTor's K8/plugin-includes.sh fails when it does not (PLAN-3395.01).
x-apk-plugin: true

services:
  soundcard-in:
    extends:
      file: "../../../DISCOVERY.Engine/Docker/plugin-base.yml"
      service: plugin-host
    container_name: Plugin-SOUNDCARD_IN
    # WHAT THIS IS, said by the container itself (PLAN-3409.01): DockTor reads
    # these with docker inspect, so its purpose and endpoint panes keep no list.
    labels:
      audio.apk.purpose: "Sound card capture offered over WebRTC"
      audio.apk.purpose.what: "soundcard-to-webrtc on host networking with /dev/snd, capturing the ALSA default input and offering it as WebRTC in room APK_SOUNDCARD_ROOM, signalled over the broker. It exits if the default card has no capture device."
      audio.apk.purpose.why: "It lets a browser tab listen to a physical input on this machine. Host networking because WebRTC ICE needs the host's real addresses."
    command: ["soundcard-to-webrtc", "--broker", "${APK_BAREMETAL_MQTT_HOST:-127.0.0.1}", "--broker-port", "${APK_BAREMETAL_MQTT_PORT:-1883}", "--room", "${APK_SOUNDCARD_ROOM:-default}"]
    profiles: [sound]
    # A sound card, and only this container's. The binary takes the broker on
    # argv rather than the environment, so compose interpolates it here.
    # WHICH CARD. Empty is the ALSA default, which on the bench host is card 0,
    # the NVidia HDMI codec: no capture, and no playback without a monitor. The
    # plugin then idles, saying so at incoming/state + incoming/detail (with the
    # devices that would open), rather than crash-looping. Name one here, e.g.
    # APK_SOUNDCARD_DEVICE=default:CARD=Generic_1 (`--list-devices` lists them).
    environment:
      - APK_SOUNDCARD_DEVICE=${APK_SOUNDCARD_DEVICE:-}
    devices:
      - /dev/snd:/dev/snd
    group_add: [audio]
    # Not built on apk-plugin-runner, so there is no health file to read; the
    # base check would report it unhealthy for ever.
    healthcheck:
      disable: true

volumes:
  # LOGGER STORAGE — owned by DATABASE.volume.Log-STORAGE, which binds it onto
  # Documentation/LOGS and is up first in the pod. NOT `external:` (PLAN-3399.01),
  # so this file's own `up` also works on a clean host: compose uses the volume
  # if it exists and makes a plain one if it does not.
  apk-audio-logs:
    name: apk-audio-logs
  mac-lookup-cache:
    name: apk-audio-mac-lookup-cache

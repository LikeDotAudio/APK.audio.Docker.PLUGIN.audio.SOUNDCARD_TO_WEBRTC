[package]
name = "apkaudio-soundcard-to-webrtc"
version = "0.2.0"
edition = "2024"
description = "Captures a system sound card and sends it as Opus over WebRTC"

[dependencies]
apkaudio-contracts = { git = "https://github.com/LikeDotAudio/APK.plugin.SDK", tag = "sdk-v2.0" }
apk-plugin-runner = { git = "https://github.com/LikeDotAudio/APK.plugin.SDK", tag = "sdk-v2.0" }
cpal = "0.15"
audiopus = "0.2"
webrtc = "0.17"
rumqttc = "0.24"
tokio = { version = "1.36", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "soundcard-to-webrtc"
path = "src/main.rs"

[dev-dependencies]
# Paused time, so the backoff test proves the wait without taking it.
tokio = { version = "1.36", features = ["full", "test-util"] }

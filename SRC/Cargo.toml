[package]
name = "apkaudio-soundcard-to-webrtc"
version = "0.1.0"
edition.workspace = true
workspace = "../../../DISCOVERY.Engine/SRC"
description = "Captures a system sound card and sends it as Opus over WebRTC"

[dependencies]
apkaudio-contracts = { path = "../../../NODE.BareMetal/SRC/contracts/rust" }
apk-plugin-runner = { path = "../../../DISCOVERY.Engine/SRC/RUNNER" }
cpal = "0.15"
audiopus = "0.2"
webrtc = "0.17"
rumqttc = "0.24"
tokio = { version = "1.36", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "soundcard-to-webrtc"
path = "src/main.rs"

# soundcard-to-webrtc configuration
# READ BY THE CRATE (src/settings.rs) AS DEFAULTS: `room`, `stun` and `device`
# below. argv (--room --stun --device) and APK_SOUNDCARD_DEVICE override them,
# and the config the runner publishes RETAINED is this file with the values the
# process actually runs with written in (LOOSE-soundcard-config-unread). The
# broker is not here: it is MQTT_HOST / MQTT_PORT or --broker, the runner's rule.
#
# CAPTURE ONLY. This agent sends audio and receives none.
[soundcard_in]
# THE SECTION IS NAMED FOR THE BUS TOKEN, `soundcard_in`, because that is the section
# apk-plugin-runner reads (`module_topic`, presence); it was `[soundcard-to-webrtc]`,
# which nothing matched. `enabled` is gone: nothing switches the agent off but
# the compose profile.
# MQTT address this file is published to, RETAINED, as `<topic>/config`, beside
# `<topic>/status` and `<topic>/host` -- the runner's own default for the token.
topic = APK.audio/System/Protocols/soundcard_in

# The signalling room, ONE topic segment; the receiver must name the same one.
room = default
# The STUN server handed to the WebRTC peer connection.
stun = stun:stun.l.google.com:19302
# Input device, exact name or unambiguous substring; empty = the host default
# input device. APK_SOUNDCARD_DEVICE (when not empty) and --device win.
device =

# NO topic_listen / topic_publish / topic_ignore here. The signalling topics
# this agent really uses are derived from `room` at runtime under
# APK.audio/Audio/WebRTC/, and declaring a key nothing loads makes the shell's
# Listening column state a falsehood. Add one back only when a named function
# in this crate reads it.
